<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot for huynhl</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", sans-serif;
      }

      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: #f3f3f3;
        border-bottom: 1px solid #ddd;
        flex-shrink: 0;
      }

      #btn-page-context {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        font-size: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: white;
        cursor: pointer;
        white-space: nowrap;
        color: #333;
      }
      #btn-page-context:hover { background: #e8e8e8; }
      #btn-page-context:disabled { opacity: 0.5; cursor: default; }

      #status-msg {
        font-size: 11px;
        color: #555;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status-msg.ok  { color: #107c10; }
      #status-msg.err { color: #c50000; }

      iframe {
        flex: 1;
        width: 100%;
        border: none;
      }

      @media (prefers-color-scheme: dark) {
        #toolbar { background: #2b2b2b; border-color: #444; }
        #btn-page-context { background: #3a3a3a; border-color: #555; color: #eee; }
        #btn-page-context:hover { background: #4a4a4a; }
        #status-msg { color: #aaa; }
        #status-msg.ok  { color: #6ccb6c; }
        #status-msg.err { color: #f87171; }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-page-context">📄 Đọc trang này</button>
      <span id="status-msg"></span>
    </div>
    <iframe
      id="underside-iframe-container"
      name="underside-iframe-container"
      frameborder="0"
      allow="clipboard-write"
    ></iframe>
    <script src="./sidepanel.js"></script>
  </body>
</html>
